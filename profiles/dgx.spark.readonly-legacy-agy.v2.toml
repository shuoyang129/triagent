# Isolated v2 gray profile: Codex proves streaming structured output, while
# AGY retains its established blocking review transport until it emits reliable
# stream progress.  It never changes the original triagent profile.
[triagent]
profile_version = 2

[agents.codex]
command = ["/home/ys/works/robots/triagent-v2/scripts/codex-readonly-verify-adapter.zsh"]
estimated_usd = 1.0
stream_v2 = true

[agents.cursor]
enabled = false
command = ["/home/ys/works/robots/triagent-v2/scripts/cursor-agent-adapter.zsh"]
stream_v2 = false

[agents.antigravity]
command = ["/home/ys/works/robots/triagent-v2/scripts/agy-review-adapter.zsh"]
estimated_usd = 1.0
stream_v2 = false

[agents.deepseek]
enabled = false
command = ["/home/ys/.opencode/bin/opencode"]
stream_v2 = false

[budget]
max_agent_calls = 4
max_minutes = 30
max_usd = 4.0

[timeouts]
read_only_size = "small"
