[host]
name = "spark-5643-v2"
platform = "ubuntu-24.04"
hardware = "nvidia-dgx-spark"
address = "spark"

[triagent]
profile_version = 2

[paths]
runs = "/home/ys/works/robots/triagent-runs-v2"
workspace = "/home/ys/works/robots/projects"
python = "/home/ys/miniforge3/envs/triagent-v2/bin/python"

[capabilities]
nvidia_gpu = true
container_runtime = "nvidia-container-toolkit"
robot_simulation = "isaac-lab"
visualization = ["local-display", "webrtc"]
background_execution = ["systemd-user", "tmux"]

[agents.codex]
command = ["/home/ys/works/robots/triagent-v2/scripts/codex-verify-adapter.zsh"]
estimated_usd = 1.0
stream_v2 = true

[agents.cursor]
enabled = false
command = ["/home/ys/works/robots/triagent-v2/scripts/cursor-agent-adapter.zsh", "--auto-review", "--sandbox", "enabled", "--model", "auto"]
estimated_usd = 1.0
stream_v2 = true

[agents.antigravity]
command = ["/home/ys/works/robots/triagent-v2/scripts/agy-review-adapter.zsh"]
estimated_usd = 1.0
stream_v2 = true

[agents.deepseek]
enabled = true
model = "deepseek/deepseek-v4-flash"
command = ["/home/ys/.opencode/bin/opencode"]
estimated_usd = 1.0
probe_estimated_usd = 0.25
smoke_timeout_seconds = 180
stream_v2 = true

[budget]
max_agent_calls = 20
max_minutes = 60
max_usd = 20.0
cursor_saver_threshold = 0.70
cursor_handoff_threshold = 0.90
allow_paid_overage = false
