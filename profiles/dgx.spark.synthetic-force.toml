[host]
name = "spark-5643-synthetic-force"
platform = "ubuntu-24.04"
hardware = "nvidia-dgx-spark"
address = "spark"

[paths]
runs = "/home/ys/works/robots/triagent-synthetic-runs"
workspace = "/home/ys/works/robots/synthetic-projects"
python = "/home/ys/miniforge3/envs/triagent/bin/python"

[capabilities]
nvidia_gpu = true
container_runtime = "nvidia-container-toolkit"
robot_simulation = "none"
visualization = []
background_execution = ["systemd-user", "tmux"]

[agents.codex]
command = ["/home/ys/works/robots/triagent/scripts/codex-verify-adapter.zsh"]
estimated_usd = 1.0

[agents.cursor]
command = ["/home/ys/works/robots/triagent/scripts/cursor-synthetic-force-adapter.zsh", "--force", "--sandbox", "enabled", "--model", "composer-2.5-fast"]
estimated_usd = 1.0

[agents.antigravity]
command = ["/home/ys/works/robots/triagent/scripts/agy-review-adapter.zsh"]
estimated_usd = 1.0

[agents.deepseek]
enabled = false
model = "deepseek-v4-flash"
base_url = "https://api.deepseek.com"
estimated_usd = 1.0
probe_estimated_usd = 0.25

[budget]
max_agent_calls = 20
max_minutes = 60
max_usd = 20.0
cursor_saver_threshold = 0.70
cursor_handoff_threshold = 0.90
allow_paid_overage = false
